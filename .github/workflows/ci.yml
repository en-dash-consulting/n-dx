# GitHub Actions — PR validation and main branch CI for n-dx
#
# Replicates the pipeline previously defined in bitbucket-pipelines.yml.
# One `build` matrix job runs ubuntu, macOS and Windows in parallel:
#   install → build → (Linux: policy, typecheck, docs, PR check, PRD structure)
#   → (macOS/Windows: smoke collect) → root e2e/integration → per-package tests
# then smoke-parity compares the macOS and Windows smoke artifacts.
#
# Node 22 LTS. Exact pnpm version managed by corepack via packageManager
# field in package.json.
#
# Action versions: checkout@v6, setup-node@v6, pnpm/action-setup@v5 all run
# on Node.js 24. upload-artifact@v4 and download-artifact@v4 are already on
# Node.js 24 and do not require bumping.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ONE MATRIX JOB, THREE OSes, ALL IN PARALLEL. ubuntu, macOS and Windows run
  # the same install -> build -> test sequence; the legs start together rather
  # than the smoke legs waiting on ubuntu. Steps that only need to run once
  # (policy checks, typecheck, docs, PRD structure, changesets) are gated to
  # the Linux leg; the cross-OS smoke collector runs on the macOS and Windows
  # legs, whose artifacts smoke-parity compares.
  #
  # `name:` comes from the matrix so the three check names — "Build &
  # Validate", "CLI Smoke (macOS)", "CLI Smoke (Windows)" — stay exactly what
  # they were. They are load-bearing for branch protection; keep them stable.
  #
  # `fail-fast: false`: the default would cancel the other OS legs the moment
  # one fails, hiding whether a defect is platform-specific.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Build & Validate
            # changeset status compares against main to compute the release plan
            fetch-depth: 0
            timeout: 20
          # macOS and Windows get 30 rather than 20: the per-package suites
          # were measured locally at ~1.7x the root suite's wall time, and these
          # runners are slower than Linux. A timeout kill presents as a red job,
          # so the headroom is deliberate. Lower it again if real runs land
          # comfortably under 20.
          - os: macos-latest
            name: CLI Smoke (macOS)
            smoke: macos
            fetch-depth: 1
            timeout: 30
          - os: windows-latest
            name: CLI Smoke (Windows)
            smoke: windows
            fetch-depth: 1
            timeout: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ matrix.fetch-depth }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check obfuscated code policy
        if: runner.os == 'Linux'
        run: pnpm security:obfuscation

      - name: Build
        run: pnpm build

      - name: Check no source maps in publish
        if: runner.os == 'Linux'
        run: |
          MAPS=""
          for pkg in packages/*/; do
            [ -f "$pkg/package.json" ] || continue
            FOUND=$(cd "$pkg" && pnpm pack --dry-run 2>&1 | grep '\.map$' || true)
            if [ -n "$FOUND" ]; then
              MAPS="$MAPS\n$pkg:\n$FOUND"
            fi
          done
          if [ -n "$MAPS" ]; then
            echo -e "Source map files would be published to npm:\n$MAPS"
            exit 1
          fi

      - name: Typecheck
        if: runner.os == 'Linux'
        run: pnpm typecheck

      - name: Docs build
        if: runner.os == 'Linux'
        run: pnpm docs:build

      - name: PR check
        if: runner.os == 'Linux'
        run: pnpm pr-check

      # `rex validate --post-merge` reports two classes of finding. Repairable
      # ones (level mismatches and similar) `--repair` fixes mechanically and
      # are advisory here — there are ~142 on the tree today and gating on them
      # would mean a sweeping PRD rewrite, the exact change this check exists to
      # make safe. Manual ones need a human decision and do gate.
      #
      # The one that matters is `orphaned-directory`: a folder holding item
      # files but no `index.md`. The rex loader cannot see those items, so the
      # next full-tree save writes out only what it loaded and silently deletes
      # them. Two such directories reached main during 0.7.1 — the detector
      # existed the whole time and nothing ran it.
      - name: PRD tree structure
        if: runner.os == 'Linux'
        run: |
          node packages/rex/dist/cli/index.js validate --post-merge --format=json . \
            | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const issues = JSON.parse(s).issues || [];
                const blocking = issues.filter((i) => i.repairable !== true);
                const repairable = issues.length - blocking.length;
                if (repairable) {
                  console.log(`note: ${repairable} repairable issue(s) — advisory; run \x60rex validate --post-merge --repair\x60`);
                }
                if (!blocking.length) {
                  console.log("PRD tree structurally sound: no issues needing manual intervention.");
                  process.exit(0);
                }
                console.error(`PRD tree has ${blocking.length} issue(s) needing manual intervention:`);
                for (const i of blocking) console.error(`  [${i.class}] ${i.path}: ${i.message}`);
                process.exit(1);
              });
            '

      # This step ASSERTS the per-OS baseline (expected exit code, stdout/stderr
      # contract, JSON shape) as well as collecting, so a platform-only CLI
      # regression fails the leg that broke it rather than smoke-parity. See
      # validateBaseline in scripts/cli-smoke-parity.mjs.
      - name: Collect normalized smoke artifact
        if: matrix.smoke
        run: node scripts/cli-smoke-parity.mjs collect --output ndx-cli-smoke-${{ matrix.smoke }}.json

      # `always()`: on a baseline failure the collector writes the artifact and
      # then exits non-zero, so the artifact holds the exact output that broke the
      # contract. Uploading it anyway is the difference between a diagnosable
      # failure and a red job with nothing to inspect. Missing-file is a warning,
      # not an error, so a collector that died before the write is still fine here.
      - name: Upload smoke artifact
        if: always() && matrix.smoke
        uses: actions/upload-artifact@v4
        with:
          name: ndx-cli-smoke-${{ matrix.smoke }}
          path: ndx-cli-smoke-${{ matrix.smoke }}.json

      # Root-level e2e / integration / gauntlet suites live in tests/** and are
      # NOT covered by the per-package runner. The bind-aware runner excludes the
      # LLM-spend sourcevision eval gate (run separately via `pnpm gauntlet:evals`)
      # and any loopback-bind suites when the runner can't bind a local socket.
      #
      # Runs on EVERY leg and EVERY event, macOS included. It was once gated to
      # main-branch pushes on macOS to save billed minutes, which meant PRs got
      # no macOS test coverage at all — and its one historical catch (run
      # 32283838405: a test assuming synchronous reaping, true for
      # `taskkill /T /F` but not POSIX `SIGKILL`) was exactly the kind of defect
      # that should be caught before merge. tests/** is where every cross-OS
      # behaviour lives: spawn/quoting, child-process lifecycle, config file
      # permissions, init, and the CLI e2e flows.
      #
      # Runs after the smoke upload so a test failure still leaves the artifact
      # published for smoke-parity's comparison on the next green run.
      - name: Run root e2e / integration tests
        run: node scripts/run-vitest-bind-aware.mjs root

      # NOT `pnpm -r run test`: that bails on the first failing package, and
      # because hench and web depend on rex they are ordered after it — so a red
      # rex meant they never executed and their absence from the log read as
      # "nothing to report". This runner executes every package regardless and
      # still exits non-zero if any failed. (`pnpm -r --no-bail` is not an
      # option: pnpm documents it as exiting 0 even when a script fails.)
      #
      # Runs on EVERY leg, macOS included, and is deliberately unconditional:
      # macOS bills at 10x Linux minutes, but coverage is not traded for speed
      # here. Reduce cost by making the suites faster, not by skipping an OS.
      - name: Run per-package tests
        run: node scripts/run-all-tests.mjs packages

      - name: Require changeset
        # Skip on the Changesets release PR: that PR's whole purpose is
        # to consume the changesets, so the directory is empty by design.
        if: runner.os == 'Linux' && github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: |
          # Skip if the PR touches no publishable package code. This avoids
          # the empty-changeset trap (a marker changeset added solely to
          # satisfy this rule will later stall the Release run with
          # "All changesets are empty; not creating PR" and block publish).
          PKG_CHANGES=$(git diff --name-only origin/main...HEAD -- 'packages/' ':!packages/*/CHANGELOG.md' ':!packages/*/package.json' || true)
          if [ -z "$PKG_CHANGES" ]; then
            echo "PR touches no package source — skipping changeset requirement."
            exit 0
          fi
          # Check for .changeset/*.md files (not config.json, not README)
          CHANGESETS=$(ls .changeset/*.md 2>/dev/null | grep -v README || true)
          if [ -z "$CHANGESETS" ]; then
            echo "No changeset found. Add one with 'pnpm changeset'."
            exit 1
          fi

      - name: Validate changesets
        # Validates every changeset's front matter against the workspace
        # (catches stale package names like "rex" vs "@n-dx/rex" that would
        # otherwise only fail in the Release workflow after merge to main).
        # --since=origin/main is required because PR checkouts are detached
        # HEAD with no local "main" branch for changeset to diff against.
        if: runner.os == 'Linux'
        run: pnpm exec changeset status --since=origin/main

  smoke-parity:
    name: CLI Smoke Parity
    runs-on: ubuntu-latest
    needs:
      - build
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download macOS smoke artifact
        uses: actions/download-artifact@v4
        with:
          name: ndx-cli-smoke-macos
          path: smoke-macos

      - name: Download Windows smoke artifact
        uses: actions/download-artifact@v4
        with:
          name: ndx-cli-smoke-windows
          path: smoke-windows

      # Pure cross-OS comparison: canonical sequence metadata, the `comparable`
      # projection, normalized failure codes, and the raw separator/line-ending
      # fingerprint. The per-OS baseline is enforced in each smoke job's collect
      # step, so this job no longer holds a contract that gets skipped whenever a
      # platform is red.
      - name: Compare smoke artifacts
        run: node scripts/cli-smoke-parity.mjs compare --mac smoke-macos/ndx-cli-smoke-macos.json --windows smoke-windows/ndx-cli-smoke-windows.json
