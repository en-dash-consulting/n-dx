# GitHub Actions — PR validation and main branch CI for n-dx
#
# Replicates the pipeline previously defined in bitbucket-pipelines.yml.
# One `build` matrix job runs ubuntu, macOS and Windows in parallel:
#   install → build → (Linux: policy, typecheck, docs, PR check, PRD structure)
#   → (macOS/Windows: smoke collect)
# then smoke-parity compares the macOS and Windows smoke artifacts.
#
# The test suites run in a separate `test` matrix job: three suite groups per
# OS, nine jobs in all, each doing its own install and build. They used to be
# two steps at the end of `build`, which ran the root suite and then every
# package suite in series on one runner: 28 to 29 minutes on Windows against a
# 30 minute timeout (run 38193308009). Splitting by suite group turns that
# into three jobs of roughly a third each, for about the same billed minutes
# plus one install and build per job.
#
# Node 22 LTS. Exact pnpm version managed by corepack via packageManager
# field in package.json.
#
# Action versions: checkout@v6, setup-node@v6, pnpm/action-setup@v5 all run
# on Node.js 24. upload-artifact@v4 and download-artifact@v4 are already on
# Node.js 24 and do not require bumping.
#
# Every `uses:` is pinned to a commit SHA with the version in a trailing
# comment. A version tag is a moving pointer the action's owner can repoint at
# any commit, so a tag pin re-resolves on every run; a SHA does not. Dependabot
# (.github/dependabot.yml) opens the PRs that move these pins, which is what
# keeps pinning from meaning "never updated".

name: CI

on:
  push:
    branches: [main]
  # PR CI is manual: a pull request runs it only when someone asks, by adding
  # the `ci:run` label (the `consume-label` job removes it again so it can be
  # added for the next run) or with the Run workflow button below. Draft or
  # ready makes no difference. The default types are gone on purpose:
  # opened, synchronize and reopened ran the full matrix on every push;
  # ready_for_review and converted_to_draft only existed to start and cancel
  # that. Every label other than `ci:run` skips (see the job gate). No
  # `unlabeled`: removing the label must not start a run. A PR still cannot
  # merge until the required checks have run on its latest commit.
  pull_request:
    types: [labeled]
  # The merge queue builds main + the queued PR on a gh-readonly-queue/main/*
  # branch and waits for the required checks to report on that merge_group run.
  # Without this trigger they never report and the queue waits forever. Steps
  # that read pull_request-only context (head_ref) must stay gated on
  # github.event_name == 'pull_request'.
  merge_group:
  # The "Run workflow" button / `gh workflow run`, for a manual run on any
  # branch. Only shown once the default branch's copy of this file
  # declares it. Runs the branch head, not the PR's merge commit with its base;
  # results appear in the Actions tab, not as a PR event. No inputs.
  workflow_dispatch:

# Least privilege for every job in this file. CI only ever needs to read the
# checkout; nothing here writes to the repository, comments on a PR, or mints
# a token. Without this block the jobs inherit the repository default, which
# is write — and these jobs run code from the pull request branch, so the
# token they hold is the blast radius of anything that branch executes.
#
# GitHub already downgrades the token to read-only for pull requests from a
# fork, so this is what covers same-repository branches, which get the
# repository default.
permissions:
  contents: read

# The group is evaluated before any job `if:`, so runs that will do nothing must
# not cancel runs that will:
#  - `dispatch-` prefix: a dispatch run shares github.ref with a push to the
#    same branch, so without it a button press on main would cancel main's push
#    run and the next push would cancel the button's run.
#  - `-noop-<run_id>`: a `labeled` event that will not run CI (any label other
#    than `ci:run`) gets a group of its own, so it cannot cancel the PR's real
#    in-flight run. A second `ci:run` while a run is in flight shares the PR
#    group and cancels the older run, on purpose: the newer one tests the
#    newer commit.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && 'dispatch-' || '' }}${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:run' && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  # Removes the `ci:run` label as soon as a run starts, so it can be added
  # again for the next commit. Checks out nothing and runs no PR code, so the
  # job-level `pull-requests: write` is safe. On a fork PR the token is
  # read-only and the removal fails; `continue-on-error` keeps CI green, and
  # the label then has to be removed by hand. PR fields go through `env:`,
  # never interpolated into `run:`.
  consume-label:
    name: Consume ci:run label
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ci:run'
    permissions:
      pull-requests: write
    timeout-minutes: 2
    steps:
      - name: Remove ci:run label
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr edit "$PR" --repo "$REPO" --remove-label ci:run

  # ONE MATRIX JOB, THREE OSes, ALL IN PARALLEL. ubuntu, macOS and Windows run
  # the same install -> build -> test sequence; the legs start together rather
  # than the smoke legs waiting on ubuntu. Steps that only need to run once
  # (policy checks, typecheck, docs, PRD structure, changesets) are gated to
  # the Linux leg; the cross-OS smoke collector runs on the macOS and Windows
  # legs, whose artifacts smoke-parity compares.
  #
  # `name:` comes from the matrix so the three check names — "Build &
  # Validate", "CLI Smoke (macOS)", "CLI Smoke (Windows)" — stay exactly what
  # they were. They are load-bearing for branch protection; keep them stable.
  #
  # `fail-fast: false`: the default would cancel the other OS legs the moment
  # one fails, hiding whether a defect is platform-specific.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # PR CI is manual: a PR event runs only for the `ci:run` label, draft or
    # ready. A job skipped by a job-level `if:` gets no runner and is not
    # billed. Do NOT write a PR-only condition without the event_name guard: on
    # push, merge_group and workflow_dispatch the PR context is null, and main
    # CI and the merge queue would stop running.
    if: github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'ci:run')
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Build & Validate
            # changeset status compares against main to compute the release plan
            fetch-depth: 0
            timeout: 15
          # Without the test suites these legs are install, build and the
          # smoke collector: under three minutes measured. 10 is headroom for
          # a slow runner, not an expectation.
          - os: macos-latest
            name: CLI Smoke (macOS)
            smoke: macos
            fetch-depth: 1
            timeout: 10
          - os: windows-latest
            name: CLI Smoke (Windows)
            smoke: windows
            fetch-depth: 1
            timeout: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch-depth }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # Before install: the lockfile decides what install fetches, so a gate
      # that runs afterwards has already let the thing it is checking for run.
      # Invoked directly rather than through `pnpm security:lockfile` so the
      # gate does not depend on pnpm's script runner working against an
      # uninstalled workspace. The script itself has no dependencies.
      - name: Check supply-chain integrity
        if: runner.os == 'Linux'
        run: node scripts/check-lockfile-integrity.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check obfuscated code policy
        if: runner.os == 'Linux'
        run: pnpm security:obfuscation

      - name: Build
        run: pnpm build

      # No grammar build here: nothing in this job runs a test. The grammar
      # steps live in the `test` job, where the sourcevision suite runs.

      - name: Check no source maps in publish
        if: runner.os == 'Linux'
        run: |
          MAPS=""
          for pkg in packages/*/; do
            [ -f "$pkg/package.json" ] || continue
            FOUND=$(cd "$pkg" && pnpm pack --dry-run 2>&1 | grep '\.map$' || true)
            if [ -n "$FOUND" ]; then
              MAPS="$MAPS\n$pkg:\n$FOUND"
            fi
          done
          if [ -n "$MAPS" ]; then
            echo -e "Source map files would be published to npm:\n$MAPS"
            exit 1
          fi

      - name: Typecheck
        if: runner.os == 'Linux'
        run: pnpm typecheck

      - name: Docs build
        if: runner.os == 'Linux'
        run: pnpm docs:build

      - name: PR check
        if: runner.os == 'Linux'
        run: pnpm pr-check

      # `rex validate --post-merge` reports two classes of finding. Repairable
      # ones (level mismatches and similar) `--repair` fixes mechanically and
      # are advisory here — there are ~142 on the tree today and gating on them
      # would mean a sweeping PRD rewrite, the exact change this check exists to
      # make safe. Manual ones need a human decision and do gate.
      #
      # The one that matters is `orphaned-directory`: a folder holding item
      # files but no `index.md`. The rex loader cannot see those items, so the
      # next full-tree save writes out only what it loaded and silently deletes
      # them. Two such directories reached main during 0.7.1 — the detector
      # existed the whole time and nothing ran it.
      - name: PRD tree structure
        if: runner.os == 'Linux'
        run: |
          node packages/rex/dist/cli/index.js validate --post-merge --format=json . \
            | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const issues = JSON.parse(s).issues || [];
                const blocking = issues.filter((i) => i.repairable !== true);
                const repairable = issues.length - blocking.length;
                if (repairable) {
                  console.log(`note: ${repairable} repairable issue(s) — advisory; run \x60rex validate --post-merge --repair\x60`);
                }
                if (!blocking.length) {
                  console.log("PRD tree structurally sound: no issues needing manual intervention.");
                  process.exit(0);
                }
                console.error(`PRD tree has ${blocking.length} issue(s) needing manual intervention:`);
                for (const i of blocking) console.error(`  [${i.class}] ${i.path}: ${i.message}`);
                process.exit(1);
              });
            '

      # This step ASSERTS the per-OS baseline (expected exit code, stdout/stderr
      # contract, JSON shape) as well as collecting, so a platform-only CLI
      # regression fails the leg that broke it rather than smoke-parity. See
      # validateBaseline in scripts/cli-smoke-parity.mjs.
      - name: Collect normalized smoke artifact
        if: matrix.smoke
        run: node scripts/cli-smoke-parity.mjs collect --output ndx-cli-smoke-${{ matrix.smoke }}.json

      # `always()`: on a baseline failure the collector writes the artifact and
      # then exits non-zero, so the artifact holds the exact output that broke the
      # contract. Uploading it anyway is the difference between a diagnosable
      # failure and a red job with nothing to inspect. Missing-file is a warning,
      # not an error, so a collector that died before the write is still fine here.
      - name: Upload smoke artifact
        if: always() && matrix.smoke
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ndx-cli-smoke-${{ matrix.smoke }}
          path: ndx-cli-smoke-${{ matrix.smoke }}.json

      - name: Require changeset
        # Skip on the Changesets release PR: that PR's whole purpose is
        # to consume the changesets, so the directory is empty by design.
        if: runner.os == 'Linux' && github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: |
          # Skip if the PR touches no publishable package code. This avoids
          # the empty-changeset trap (a marker changeset added solely to
          # satisfy this rule will later stall the Release run with
          # "All changesets are empty; not creating PR" and block publish).
          PKG_CHANGES=$(git diff --name-only origin/main...HEAD -- 'packages/' ':!packages/*/CHANGELOG.md' ':!packages/*/package.json' || true)
          if [ -z "$PKG_CHANGES" ]; then
            echo "PR touches no package source — skipping changeset requirement."
            exit 0
          fi
          # Check for .changeset/*.md files (not config.json, not README)
          CHANGESETS=$(ls .changeset/*.md 2>/dev/null | grep -v README || true)
          if [ -z "$CHANGESETS" ]; then
            echo "No changeset found. Add one with 'pnpm changeset'."
            exit 1
          fi

      - name: Validate changesets
        # Validates every changeset's front matter against the workspace
        # (catches stale package names like "rex" vs "@n-dx/rex" that would
        # otherwise only fail in the Release workflow after merge to main).
        # --since=origin/main is required because PR checkouts are detached
        # HEAD with no local "main" branch for changeset to diff against.
        if: runner.os == 'Linux'
        run: pnpm exec changeset status --since=origin/main

  # THE TEST SUITES: THREE GROUPS PER OS, NINE JOBS, ALL IN PARALLEL.
  #
  # Each group is a comma list of suite labels that scripts/run-all-tests.mjs
  # already accepts (`root` is tests/**, the rest are package directory names).
  # The groups pair a long suite with a short one so the three jobs on a given
  # OS finish close together; measured per-suite seconds on run 38193308009
  # (Windows): root 484, rex 423, hench 366, web 266, sourcevision 98,
  # llm-client 29. Rebalance when those move.
  #
  # Every group runs on EVERY OS and EVERY event, macOS included. macOS bills at
  # 10x Linux minutes, but coverage is not traded for speed here: tests/** is
  # where every cross-OS behaviour lives (spawn/quoting, child-process
  # lifecycle, config file permissions, init, the CLI e2e flows), and its one
  # historical catch on macOS (run 32283838405: a test assuming synchronous
  # reaping, true for `taskkill /T /F` but not POSIX `SIGKILL`) was exactly the
  # kind of defect that must be caught before merge. Reduce cost by making the
  # suites faster, not by skipping an OS.
  #
  # The runner is scripts/run-all-tests.mjs, NOT `pnpm -r run test`: that bails
  # on the first failing package, and because hench and web depend on rex they
  # are ordered after it — so a red rex meant they never executed and their
  # absence from the log read as "nothing to report". The script runs every
  # selected suite regardless and still exits non-zero if any failed. For
  # `root` it delegates to the bind-aware runner, which excludes the LLM-spend
  # sourcevision eval gate (run separately via `pnpm gauntlet:evals`) and any
  # loopback-bind suites when the runner can't bind a local socket.
  #
  # No `needs: build`: each job installs and builds for itself (about a minute
  # and a half on Windows) so the nine start together rather than queueing
  # behind the validate leg.
  test:
    name: Tests (${{ matrix.runner }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    # Same gate as `build` (see the comment there).
    if: github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'ci:run')
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # The default would cancel the other eight the moment one fails, hiding
      # whether a defect is platform-specific or suite-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        group: [root+llm-client, rex+sourcevision, hench+web]
        include:
          - group: root+llm-client
            suites: root,llm-client,lang-kit,lang-runtime,lang-java,lang-go,lang-sql,lang-terraform,lang-python
          - group: rex+sourcevision
            suites: rex,sourcevision
          - group: hench+web
            suites: hench,web
          - os: ubuntu-latest
            runner: Linux
            timeout: 15
          - os: macos-latest
            runner: macOS
            timeout: 15
          # Windows gets 20 rather than 15: the heaviest group measured 10.4
          # minutes of suite time, 11.9 for the job (run 38274629084), and a
          # timeout kill presents as a red job. Lower it once the later layers
          # of this series land and real runs sit comfortably under 15.
          - os: windows-latest
            runner: Windows
            timeout: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No Defender exclusion step, deliberately. One was tried: its own
      # listing showed `C:\` and `D:\` already excluded on the hosted Windows
      # runner, and the per-suite times did not move (hench 353 s against 366
      # without it, web 263 against 266, run 38274629084). The Windows gap
      # against Linux is process creation itself, so the lever is fewer spawns
      # per test, not scanning.

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The root suite's globalSetup (tests/e2e/verify-build.js) refuses to run
      # against a missing or stale dist/, and the e2e tests spawn the built CLIs.
      - name: Build
        run: pnpm build

      # Grammars are a build artifact (never committed). Without them every
      # skipUnlessGrammar test (runner, grammar, pack queries, pack goldens)
      # skips and a regression there goes green. Those tests are in the suites
      # of sourcevision, lang-runtime and every pack; scripts/grammar-suites.mjs
      # derives that list from the manifests, and the steps below run on each
      # leg whose group includes one of them. They must be in this job, before
      # the run step: a GITHUB_ENV export reaches only later steps of the same
      # job, so setting it in `build` left every test here skipping.
      # tests/e2e/ci-grammar-steps.test.js fails if a leg loses them.
      # SV_REQUIRE_GRAMMARS=1 turns a missing-grammar skip into
      # a failure. build-grammars.mjs pins the tree-sitter CLI for linux,
      # macos and windows. The cache holds the SHA-256-verified CLI, grammar,
      # wasi-sdk and binaryen archives (re-verified on use) and the extracted
      # toolchains, all under packages/lang-runtime/build/cache; the CLI is
      # pointed at those and never downloads into the OS cache dir. Key on the
      # script, which holds every pin.
      - name: Decide whether this group needs grammars
        id: grammars
        shell: bash
        # Fail on anything but true/false: an empty answer would skip the
        # grammar steps below and leave every grammar test skipping, green.
        run: |
          build=$(node scripts/grammar-suites.mjs ${{ matrix.suites }})
          case "$build" in true|false) ;; *) echo "grammar-suites.mjs printed '$build'"; exit 1 ;; esac
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Cache grammar build downloads
        if: steps.grammars.outputs.build == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/lang-runtime/build/cache
          key: grammars-${{ runner.os }}-${{ hashFiles('packages/lang-runtime/scripts/build-grammars.mjs') }}

      # Every language pack builds its own grammar (`build:grammars`) into its
      # own build/grammars; sourcevision has none. One at a time, since they
      # share the download cache.
      - name: Build tree-sitter grammars
        if: steps.grammars.outputs.build == 'true'
        run: pnpm -r --workspace-concurrency=1 run build:grammars

      # `shell: bash` so the same line works on the Windows leg, whose default
      # shell is PowerShell.
      - name: Require built grammars in tests
        if: steps.grammars.outputs.build == 'true'
        shell: bash
        run: echo "SV_REQUIRE_GRAMMARS=1" >> "$GITHUB_ENV"

      # Node 22's on-disk compile cache. Hundreds of e2e tests each spawn a
      # fresh CLI process that loads the same dist/ trees; with the cache every
      # spawn after the first reuses the compiled bytecode. Measured locally:
      # the sourcevision CLI's startup halved, hench's trimmed, rex's unchanged.
      #
      # Set on the step, not the job: a job-level `env` may use only the
      # github, needs, strategy, matrix, vars, secrets and inputs contexts, and
      # `runner` is not among them. With it at job level the workflow file was
      # rejected outright and no job of the run started (run 38266552069).
      - name: Run ${{ matrix.suites }}
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: node scripts/run-all-tests.mjs ${{ matrix.suites }}

  smoke-parity:
    name: CLI Smoke Parity
    runs-on: ubuntu-latest
    # Same gate as `build` (see the comment there). Redundant with `needs:`
    # today, but it keeps the intent readable and survives `if: always()`.
    if: github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'ci:run')
    needs:
      - build
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download macOS smoke artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ndx-cli-smoke-macos
          path: smoke-macos

      - name: Download Windows smoke artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ndx-cli-smoke-windows
          path: smoke-windows

      # Pure cross-OS comparison: canonical sequence metadata, the `comparable`
      # projection, normalized failure codes, and the raw separator/line-ending
      # fingerprint. The per-OS baseline is enforced in each smoke job's collect
      # step, so this job no longer holds a contract that gets skipped whenever a
      # platform is red.
      - name: Compare smoke artifacts
        run: node scripts/cli-smoke-parity.mjs compare --mac smoke-macos/ndx-cli-smoke-macos.json --windows smoke-windows/ndx-cli-smoke-windows.json
