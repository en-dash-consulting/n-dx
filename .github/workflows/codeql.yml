# CodeQL static analysis.
#
# Free for public repositories. Covers the class of defect that review and the
# test suite both miss: injection and traversal reachable from a path nobody
# wrote a test for. It is not a substitute for the architecture and
# domain-isolation policy tests, which encode rules CodeQL has no way to know.
#
# The weekly schedule matters as much as the per-PR run: CodeQL's queries are
# updated continuously, so a scan finds defects in code that has not changed
# since the last scan passed.
name: CodeQL

on:
  push:
    branches: [main]
  # ready_for_review starts the scan the moment a draft is marked ready;
  # converted_to_draft starts a run whose job skips, so the concurrency group
  # cancels the in-flight scan.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # No merge_group trigger, deliberately: code-scanning merge protection does
  # not apply to merge queue groups, so the queue never waits on CodeQL. It
  # still runs on every PR, on push to main and weekly.
  # https://docs.github.com/en/code-security/concepts/code-scanning/merge-protection
  schedule:
    # Mondays, 09:17 UTC. Off the hour deliberately — scheduled jobs on the
    # hour queue behind everyone else's.
    - cron: "17 9 * * 1"

permissions:
  contents: read

# Cancel only superseded PR scans. Push-to-main and the weekly schedule share
# refs/heads/main, and neither may be cancelled by the other.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Drafts cannot merge, so a draft PR scan buys nothing. The event_name
    # guard keeps push-to-main and the schedule running: there the PR context
    # is null and `draft == false` alone would skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 30

    permissions:
      # Uploading the SARIF result is the only write this needs.
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `build-mode: none` for both languages. CodeQL does not need a compiled
      # artifact to analyse JavaScript or TypeScript, and the alternative —
      # autobuild — would execute this repository's build scripts inside a job
      # holding `security-events: write`, which is the one job where running
      # a pull request's own code is worth avoiding.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
