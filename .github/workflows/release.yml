# Automated npm releases via Changesets
#
# Flow:
# 1. PRs merged to main with .changeset/ files trigger this workflow
# 2. The "Version Packages" PR is auto-created/updated with bumped versions + changelog
# 3. Merging the "Version Packages" PR triggers npm publish + git tags + GitHub releases
# 4. A final step fails the job if npm has the version but GitHub lacks its
#    tags or releases (see "Verify tags and GitHub releases match npm").
#
# History: 0.5.0 through 0.7.0 (Aug–Sep 2026) reached npm with no tags and no
# GitHub releases while every run stayed green. PR #334 moved @changesets/cli
# to v3, whose `publish` output no longer prints the `New tag:` lines that
# changesets/action@v1 regex-scraped to learn what was published — so v1
# matched nothing, pushed nothing, and reported published=false. v2 of the
# action reads the CLI's CHANGESETS_OUTPUT NDJSON side-channel instead, and
# the verify step below makes a repeat impossible to miss.
#
# Publishes via npm Trusted Publishing (OIDC) — no long-lived token. Each
# @n-dx/* package must have a Trusted Publisher configured at npmjs.com
# pointing at this workflow (en-dash-consulting/n-dx, release.yml,
# environment "npm"). Trusted publisher config is per-package, not per-scope.

name: Release

on:
  push:
    branches: [main]
  # Manual trigger for trusted-publisher validation without publishing.
  # Choose "validate-oidc" to run only the OIDC exchange probe — confirms
  # each package's trusted publisher config accepts this workflow + env
  # combination, without uploading anything.
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: "Run mode"
        default: publish
        options:
          - publish
          - validate-oidc

# Deny by default at the file level; the release job below grants itself
# exactly what it needs. A job added here later starts with nothing rather
# than inheriting the repository default, which is write — and this is the
# workflow that holds the OIDC identity npm trusts.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm
    # Covers the verify step's bounded npm wait (scripts/verify-release-sync.mjs,
    # about 9 minutes at worst) on top of install, build, tests and publish, so
    # a version that never appears fails with the script's error, not a timeout.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # rex release stamp needs full history and release tags.
          fetch-depth: 0

      - name: Validate trusted publisher OIDC exchange
        # Runs only when manually dispatched with mode=validate-oidc. Mints
        # the same GitHub OIDC token the publish step would, then POSTs it
        # to npm's token-exchange endpoint for each package. A 200 response
        # means the package's Trusted Publisher config matches this
        # workflow + environment exactly; any other status means publish
        # would fail. No upload happens — purely a config probe.
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'validate-oidc'
        env:
          REGISTRY: https://registry.npmjs.org
          # Space-separated list of package names (without @n-dx/ prefix)
          PACKAGES: "core rex sourcevision hench llm-client web"
        run: |
          set -uo pipefail
          AUDIENCE="npm:registry.npmjs.org"

          # 1) Mint the GitHub OIDC token (same flow npm CLI uses)
          ID_TOKEN=$(curl -sSf \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" \
            | jq -r '.value')

          if [ -z "${ID_TOKEN}" ] || [ "${ID_TOKEN}" = "null" ]; then
            echo "::error::Failed to mint GitHub OIDC token"
            exit 1
          fi

          # Register the bearer JWT as a workflow secret so any accidental
          # echo of it later (in scripts, error traces, set -x, etc.) is
          # replaced with *** in the log.
          echo "::add-mask::${ID_TOKEN}"

          echo "OIDC token claims (compare these to the trusted publisher config on npmjs.com):"
          # Only the listed claim fields are printed — JWT signature and any
          # other claims are not. These fields are metadata, not secrets.
          echo "${ID_TOKEN}" | cut -d. -f2 | base64 -d 2>/dev/null \
            | jq '{repository, workflow_ref, environment, ref, event_name, sub}' || true
          echo

          # 2) Probe the token-exchange endpoint per package.
          # Encoding matches npm-package-arg's escapedName: only "/" → "%2f".
          FAILED=0
          for pkg in ${PACKAGES}; do
            ENC="@n-dx%2f${pkg}"
            URL="${REGISTRY}/-/npm/v1/oidc/token/exchange/package/${ENC}"

            HTTP=$(curl -sS -o /tmp/oidc-resp.json -w "%{http_code}" \
              -X POST "${URL}" \
              -H "Authorization: Bearer ${ID_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "npm-auth-type: oidc")

            # Success = registry minted a publish token. npm returns 201
            # Created on success; presence of .token is the real signal.
            if jq -e .token /tmp/oidc-resp.json > /dev/null 2>&1; then
              # Defense in depth: register any minted publish token as a
              # mask before any later step could echo it.
              MINTED=$(jq -r .token /tmp/oidc-resp.json)
              echo "::add-mask::${MINTED}"
              echo "✓ @n-dx/${pkg}: trusted publisher accepted (HTTP ${HTTP})"
            else
              echo "✗ @n-dx/${pkg}: HTTP ${HTTP}"
              # Strip .token from any dumped body — on the slim chance the
              # registry ever returns one alongside an error we still don't
              # want to print it.
              jq 'del(.token)' /tmp/oidc-resp.json 2>/dev/null \
                || cat /tmp/oidc-resp.json
              echo
              FAILED=$((FAILED + 1))
            fi
          done

          if [ "${FAILED}" -gt 0 ]; then
            echo "::error::${FAILED} package(s) failed OIDC validation — check trusted publisher configs on npmjs.com"
            exit 1
          fi
          echo "All packages validated successfully."

      - name: Install pnpm
        if: github.event_name == 'push' || inputs.mode == 'publish'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        if: github.event_name == 'push' || inputs.mode == 'publish'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for Trusted Publishing
        # OIDC trusted publishing and provenance attestation require npm
        # >= 11.5.1. Node 22 ships with npm 10.x by default.
        #
        # Pinned to 11.15.0: npm 11.16.0 (released 2026-05-27) regressed
        # `npm info` with "Invalid time value" against npmjs.org metadata,
        # breaking `changeset publish`. Revisit when npm ships a fix.
        if: github.event_name == 'push' || inputs.mode == 'publish'
        run: npm install -g npm@11.15.0

      - name: Install dependencies
        if: github.event_name == 'push' || inputs.mode == 'publish'
        run: pnpm install --frozen-lockfile

      - name: Check obfuscated code policy
        if: github.event_name == 'push' || inputs.mode == 'publish'
        run: pnpm security:obfuscation

      - name: Build
        if: github.event_name == 'push' || inputs.mode == 'publish'
        run: pnpm build

      # @n-dx/sourcevision ships build/grammars/*.wasm (package.json "files").
      # Grammars are never committed, so they must be built here or the
      # published package degrades every language pack to inventory-only.
      # SV_REQUIRE_GRAMMARS=1 makes the tests below — including
      # tests/e2e/packed-tarball.test.ts, which packs the tarball and loads
      # the packs from it — fail rather than skip when a grammar is missing.
      # Same cache as ci.yml.
      - name: Cache grammar build downloads
        if: github.event_name == 'push' || inputs.mode == 'publish'
        uses: actions/cache@v4
        with:
          path: |
            packages/sourcevision/build/cache
            ~/.cache/tree-sitter
          key: grammars-${{ runner.os }}-${{ hashFiles('packages/sourcevision/scripts/build-grammars.mjs') }}

      - name: Build tree-sitter grammars
        if: github.event_name == 'push' || inputs.mode == 'publish'
        run: node packages/sourcevision/scripts/build-grammars.mjs

      - name: Require built grammars in tests
        if: github.event_name == 'push' || inputs.mode == 'publish'
        run: echo "SV_REQUIRE_GRAMMARS=1" >> "$GITHUB_ENV"

      - name: Run unit tests
        if: github.event_name == 'push' || inputs.mode == 'publish'
        run: pnpm -r run test

      - name: Create Release PR or Publish
        if: github.event_name == 'push' || inputs.mode == 'publish'
        id: changesets
        # v2 is the line compatible with @changesets/cli v3 (v1 only
        # understands CLI v2 output). v2 renamed every input: version →
        # version-script, publish → publish-script, title → pr-title,
        # commit → commit-message, commitMode → push-with-git-cli.
        #
        # v2 learns which packages were published from the NDJSON file the
        # CLI writes to $CHANGESETS_OUTPUT — the action sets that variable in
        # the publish-script's environment and `pnpm exec` passes it through,
        # so nothing extra is needed here. It then pushes each tag and creates
        # a GitHub release per package (defaults: create-github-releases=true,
        # push-git-tags=true, push-with-git-cli=false — tags and the version
        # commit are pushed through the GitHub API and signed by GitHub; set
        # push-with-git-cli: true to go back to plain `git push`).
        #
        # The version script also runs `rex release stamp <version>`, so the
        # Version Packages PR carries shippedIn on every change the release
        # ships. The action runs version-script without a shell, so the
        # chaining lives in the root `version-packages` script. The stamp never
        # blocks a release: if it fails, the script prints a warning and
        # versioning continues (release tags remain the shippedIn fallback).
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2 branch head, 2026-10-09 — upstream ships no v2 tag
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm exec changeset publish
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          # v2 ignores a GITHUB_TOKEN env var; the token must arrive through
          # this input. This is the default value, spelled out on purpose.
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # No NODE_AUTH_TOKEN / NPM_TOKEN — auth comes from GitHub OIDC.
          # id-token: write above grants the runner permission to mint the
          # OIDC token that pnpm/npm exchange with the registry for a
          # short-lived publish credential. (v2 also dropped v1's .npmrc
          # handling, so an NPM_TOKEN would be ignored anyway.)
          NPM_CONFIG_PROVENANCE: true

      - name: Verify tags and GitHub releases match npm
        # Decides from the changesets action's `published` output, not from an
        # npm lookup: the registry can lag a publish by minutes. When this run
        # published, scripts/verify-release-sync.mjs waits (bounded) for every
        # package to appear on npm, then fails if origin lacks a tag or GitHub
        # lacks a release for any of them: the symptom that stayed green for
        # five releases before this step existed. When it did not publish
        # (the Version-PR path), the script exits 0.
        if: github.event_name == 'push' || inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          PACKAGES: "core rex sourcevision hench llm-client web"
        run: node scripts/verify-release-sync.mjs
