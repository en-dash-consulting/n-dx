# Dependabot configuration.
#
# The `github-actions` ecosystem is the half that makes SHA-pinned workflows
# maintainable: every `uses:` in .github/workflows/ is pinned to a commit, so
# nothing drifts on its own — and without an updater, nothing moves at all and
# the pins quietly rot. Dependabot rewrites both the SHA and the trailing
# version comment, so the PR says which version it is moving to.
#
# npm updates are weekly and grouped. They matter less here than they would
# elsewhere, because .npmrc already sets ignore-scripts (no install-time
# execution) and minimum-release-age (no freshly-published versions) — this is
# about staying current on advisories, not about blocking a live attack.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR per risk class rather than one per package: a dev-dependency
      # bump and a production bump deserve different scrutiny, and batching
      # them together means neither gets it.
      dev-dependencies:
        dependency-type: development
        patterns: ["*"]
      production-dependencies:
        dependency-type: production
        patterns: ["*"]
    # Updates held back on purpose. Each entry says what breaks and what would
    # let it go; remove an entry once that has happened.
    ignore:
      # TypeScript 7 ships only the `tsc` binary: its package has none of the
      # compiler API (createSourceFile, SyntaxKind, forEachChild, ...) that
      # sourcevision's analyzers and hench's dead-code analyzer call at
      # runtime, so the build fails outright. Lift when sourcevision has a
      # way to parse TypeScript that does not depend on that API.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Preact 11 types useRef as RefObject<T | null>, which fails the web
      # build in four components, and its runtime changes have not been
      # checked against the dashboard. Lift as part of that migration.
      - dependency-name: "preact"
        update-types: ["version-update:semver-major"]
      # Graview moves in lockstep with GRAVIEW_VERSION in
      # packages/graview/src/document.ts, which the declaration test holds to
      # the @graview/core release the declaration was checked against. A
      # version bump is part of the Graview release work, not a dependency
      # update.
      - dependency-name: "graview"
      - dependency-name: "@graview/*"
