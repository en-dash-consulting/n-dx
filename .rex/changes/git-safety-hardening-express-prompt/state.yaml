    resolutionType: "code-change"
    resolutionDetail: "excludeHenchRuntimeArtifacts now takes projectDir (required, so tsc checks both call sites) and resolves the project's repo-relative prefix, applying it to the artifact patterns so a sibling project's .hench/ stays outside the match. Both paths are canonicalised via realpath first — git rev-parse returns realpaths while projectDir often does not, which silently reintroduced the bug on macOS; caught by the new tests. Eight new tests cover the nested layout end-to-end; empty prefix outside a repo preserves prior behaviour."
