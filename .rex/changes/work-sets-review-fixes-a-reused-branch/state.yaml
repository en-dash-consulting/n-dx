    resolutionDetail: "Rows whose delivery already named the branch at its fork point (merge-base of HEAD and the default branch, local and origin refs) are an earlier use: out of ids and hasAssignments, listed as WorkSet.earlier. Fork point read with git grep + cat-file --batch of state.yaml under the resolved rex changes/ dir (branch-naming.ts); unreadable fork point keeps old behaviour. branchWorkState is the one read; currentWorkSet, findNextWorkTask (returns earlierUse), rex next, get_next_task, rex branch show and hench (--resolve earlierUse, WorkSetExhaustedError finished vs exhausted) use it. Finished set says so and stays narrowed. Tests: rex e2e cli-branch-earlier-use (reused name, finished, rebased, no default branch), MCP and hench resolve/selection reused-name cases."
