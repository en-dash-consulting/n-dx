    resolutionDetail: "handleScopedRoute now takes `run: () => RouteResult` and invokes it only when the guard passes, so an already-invoked handler is a compile error (verified: TS2345). All 11 call sites migrated, including the ask route whose interim inline guard is folded back in. Removed resolveRouteResult, a no-op ternary with identical branches whose only caller was this helper. Two reachable routes (/api/notion/*, /api/merge-graph) covered by child-process tests, verified red before the change."
