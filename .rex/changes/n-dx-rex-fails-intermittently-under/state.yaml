    startedAt: "2026-09-10T20:40:54.864Z"
    completedAt: "2026-09-11T19:08:54.002Z"
    endedAt: "2026-09-11T19:08:54.002Z"
    resolutionType: "code-change"
    resolutionDetail: "Two root causes fixed: file-lock TOCTOU holes (mid-creation grace re-read, claim-by-rename stale cleanup) and the stale-save guard firing on same-writer leaf-to-folder promotions (guard is now id-aware — violations require a newer file whose item id is absent from the saved document). Verified with 20 consecutive green full-suite runs."
    appliedAt: "2026-09-11T19:08:54.002Z"
    lastModified: "2026-09-11T21:31:10.005Z"
