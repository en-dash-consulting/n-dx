    resolutionDetail: "Settled the underlying question as \"absent means no opinion\": a bundle cannot know the destination's relationship to its own remote, so `--replace` now carries the destination's remoteId/lastSyncedAt onto surviving ids rather than clearing them. Stated in applyDestinationSyncPointers' docblock at the point of application. Only the replace branch needed it — merge already leaves colliding locals untouched, pinned by a test. The helper also clears pointers for ids the destination has never seen, which closed a second gap a guard test exposed: mergeBundle alone would otherwise install pointers a bundle carried (parseBundle strips them, so the CLI path was never exposed). 9 tests; the fix was temporarily disabled to confirm 5 of them actually fail without it, the other 4 being guards on already-correct behaviour. AC5 met by preservation — remove-feature.ts builds its synced-items warning by reading remoteId. Full suite 6/6."
