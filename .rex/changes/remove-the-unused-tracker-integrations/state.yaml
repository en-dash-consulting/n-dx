    resolutionType: "code-change"
    resolutionDetail: "All three of Hal's should-fix findings addressed. (3) migrate-slugs.ts: the refusal hint now names the condition the guard tests — the store does not implement adoptSlugRule — instead of claiming a remote adapter. (2) Removed the shipped preview's tracker surface: the notion-config nav item with its sec-030 section and pnl-sync-settings panel from index.layout.json, and the s-sync nav item, s-sync settings form, sync command row and rex.notionSync / rex.integrations flag rows from option1-demo.html; src/preview and the built dist/preview are both clean on all three acceptance greps, the JSON parses with no duplicate ids and no orphaned panel or section, and the /notion-config -> /project alias in view-routing.ts is untouched. (1) The resolveStore tolerance tests were already present in f65e407f4 (Hal reviewed an earlier push), so rather than accept a green suite I mutation-checked them: routing resolveStore through createStore turns five tests red with 'Unknown store adapter \"notion\"', the exact startup breakage Hal described, and the mutation was reverted. Two patch changesets (@n-dx/rex, @n-dx/web). Build, typecheck and all six suites green."
    lastModified: "2026-10-07T03:22:26.755Z"
    lastModifiedBy: "Ryan Keith <ryan.k@endash.us>"
