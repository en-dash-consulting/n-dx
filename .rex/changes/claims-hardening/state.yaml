    completedAt: "2026-09-24T15:54:36.114Z"
    endedAt: "2026-09-24T15:54:36.114Z"
    resolutionType: "code-change"
    resolutionDetail: "All three refusal formatters print commands scoped with -- to exactly the listed paths (add for existing, rm --cached for deleted via print-time existence check, commit and stash push over the full set, complete past display truncation); the agent prompt stages named paths instead of -A; formatter unit tests assert no unscoped command and full pathspec coverage; policy test bars 'git add -A'/'git add .' from hench src. Commit af7b6b88 on feat/claims-hardening-pr-e (rebased onto merged PR C)."
    lastModified: "2026-09-24T15:54:38.158Z"
    lastModifiedBy: "Sterling H <sterling.h@endash.us>"
  "c943aa11-0897-4a86-b123-0a91be9eb493":
