    resolutionDetail: "Recommended option implemented: isLive never retires a claim carrying a reason, so a held claim survives past the 4h lease and ends only on ndx claim release, release --force, or a same-worktree re-claim. TODO at claims.ts:353 resolved; controlled-clock store test covers the overnight case; ndx claim list and the TaskClaimedElsewhereError held branch state the hold does not expire. Commit f9aa4915 on feat/claims-hardening-pr-e."
