  "2fa5da62-773b-48d9-bcd6-8aaa6011b465":
    status: "completed"
    startedAt: "2026-09-30T18:58:17.452Z"
    completedAt: "2026-09-30T19:28:34.075Z"
    endedAt: "2026-09-30T19:28:34.075Z"
    resolutionType: "code-change"
    resolutionDetail: "Added settings-frame.ts (controlled: dirty/saving/error/onSave/onDiscard, renders Save + unsaved-changes indicator + leave prompt) and use-leave-guard.ts (module-level singleton guard, since the frame mounts deep in the overlay while useRouteState lives at the app root — no context provider needed since only one frame is ever mounted at a time). navigateTo, handleSidebarNav and the popstate handler in use-route-state.ts now route through guardedLeave(); popstate re-pushes the settings entry when blocked (captured via a currentRef, since location has already moved by the time the event fires) and replays the target via guardedLeave's deferred action on Discard. Dialog modelled on delete-confirmation.ts. beforeunload armed only while dirty, via a ref-held onDiscard to avoid re-arming on every render."
    lastModified: "2026-09-30T19:28:34.449Z"
    lastModifiedBy: "Ryan Keith <ryan.k@endash.us>"
