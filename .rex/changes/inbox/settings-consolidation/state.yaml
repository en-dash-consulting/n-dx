    completedAt: "2026-09-30T23:16:19.786Z"
    endedAt: "2026-09-30T23:16:19.786Z"
    resolutionType: "code-change"
    resolutionDetail: "Redirected handleSetProjectSection's claude.* write to llm.claude.* (validation still keyed off \"claude\" so CLAUDE_VALIDATORS keeps running; storage keyed off \"llm\" so it lands at llm.claude.<field> with the existing local-file routing/cascade); added a stderr deprecation note naming the key written. Made handleGet and handleShowAll resolve claude via resolveClaudeSettings, now a thin async wrapper over @n-dx/llm-client's resolveClaudeConfig (dynamic import, replacing the hand-written duplicate — closes #466). Updated tests/e2e/cli-config.test.js: 9 assertions retargeted to llm.claude.*, one test rewritten to set the legacy key directly (redirect made the old setup moot), added a write+deprecation-note test and a legacy-only-project read test. Added a patch changeset for @n-dx/core."
    lastModified: "2026-09-30T23:16:20.164Z"
    lastModifiedBy: "Ryan Keith <ryan.k@endash.us>"
