    resolutionDetail: "GET /api/llm/config now returns effective: { vendor, provider, model, modelSource }. New packages/web/src/server/effective-agent-config.ts twins hench's resolveAgentModel (minus the cli-override rung) and cmdRun's provider switch; hench exports resolveAgentModel for the contract test. Fixture matrix across 4 vendors x 9 config shapes in tests/integration/effective-agent-config-contract.test.js compares both sides; symbol pin in cross-package-contracts.test.js. 17 new web unit tests. Patch changesets for @n-dx/web and @n-dx/hench."
