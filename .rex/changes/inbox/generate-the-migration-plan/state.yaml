    resolutionType: "code-change"
    resolutionDetail: "`reviewed` is now { id, hash }[]. stampReview (migration-plan-data.ts) stamps reviewedHash only when specHash(current draft) equals the approved hash; otherwise it sets a reviewNote naming both hashes. Rules, spec pass and Jev pass all call it; reviewQueue lists specChanged entries."
