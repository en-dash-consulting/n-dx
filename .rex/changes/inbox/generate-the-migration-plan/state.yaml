    completedAt: "2026-10-09T01:11:35.021Z"
    endedAt: "2026-10-09T01:11:35.021Z"
    resolutionType: "code-change"
    resolutionDetail: "jev-review-pass.ts: Jev pass bundles each item's questions into one request (placement + kind for held items, job noul for areas, criterion and test-link nouls for capabilities). Entries carry their lowest confidence; the summary carries reviewQueue and jevReview counts via the new pipeline summarize hook. A link is dropped only under autoAccept confident; dropping a link from a reviewed spec clears reviewedHash. planSeams gains jevReview and warn options. New task class prd.migrate.judge."
    lastModified: "2026-10-09T01:11:35.282Z"
    lastModifiedBy: "Ryan Keith <ryan.k@endash.us>"
