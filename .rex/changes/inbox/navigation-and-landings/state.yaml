  "22d013f6-b2f5-46e3-a335-91ae32d2e934":
    status: "completed"
    startedAt: "2026-09-29T17:33:06.425Z"
    completedAt: "2026-09-29T19:59:07.373Z"
    endedAt: "2026-09-29T19:59:07.373Z"
    resolutionType: "code-change"
    resolutionDetail: "Added packages/web/src/viewer/views/view-meta.ts: one entry per ViewId (label, glyph, product, blurb), typed `as const satisfies Record<ViewId, ViewMeta>` so a missing view is a compile error and VIEW_META[stageId].product narrows to the three packages. stages.ts re-exports it and now records only placement; sections name a view id and take their heading from it. Removed breadcrumb.ts's VIEW_META, guide.ts's 23 per-entry titles, and sourcevision-tabs.ts (+ its test), whose assertions moved onto the Analysis stage. Top nav, stage pages, Home cards, breadcrumb, document.title, guide headings, stage links and settings overlay all read the model. Labels resolved: graph=Repository Map, hench-runs=Runs, activity=Execution Log, analysis=Add Items, rex-dashboard=Up Next, workspaces=Workspaces (was \"Overview\", colliding with SourceVision's Overview). No route changed. New tests: navigation-model.test.ts (38 ViewIds enumerated independently via buildValidViews; exactly-one-entry, exactly-one-placement, no duplicate labels; breadcrumb/title/guide/top-nav/Home-cards/stage-sections/settings all asserted equal to the model) and navigation-a11y.test.ts (desktop + narrow, the narrow case derived by parsing shell.css's display:none rules). Also fixed a crash the new test exposed: useProjectStatus casts /api/status unchecked, so a 200 missing a section threw through HomeView's render and blanked the default landing page; stageFacts now takes Partial&lt;ProjectStatus&gt;, pinned by home-partial-status.test.ts. Updated ZONES.md and .n-dx.json pins. Commit e420493e."
    lastModified: "2026-09-29T19:59:07.858Z"
    lastModifiedBy: "Ryan Keith <ryan.k@endash.us>"
