  "a56a8025-c0ba-4e29-a581-d8c79b513472":
    status: "completed"
    startedAt: "2026-09-30T17:32:13.340Z"
    completedAt: "2026-09-30T18:12:17.637Z"
    endedAt: "2026-09-30T18:12:17.637Z"
    resolutionType: "code-change"
    resolutionDetail: "Generalised StageSection.alt (a 2-way {view,label,primaryLabel} toggle) into StageSection.tabs: StageTab[] ({view, hiddenWhenDeployed?}), rendered generically in stage-pages.ts's Section as an ARIA tablist (role=tab/tabpanel, aria-selected, roving tabindex with arrow/Home/End key nav) instead of the old aria-pressed buttons. stages.ts's analyze section list folds graph+iso-map+zones into one section (view:\"graph\", tabs:[iso-map,zones]) and architecture+routes into one (view:\"architecture\", tabs:[routes]) — 10 sections down to 8. Added StageSection.group ({heading,blurb}) for a section named by no single view: Terrain has no route of its own, so it needs an override; the merged Architecture section keeps the architecture view's own label/blurb, no override needed. iso-map keeps hiddenWhenDeployed:true, the static-export exemption the old alt.view carried. Views iso-map.ts/zones.ts/architecture.ts/routes.ts untouched — reused as tab bodies via the existing renderView(view) dispatch in view-registry.ts, so their glossary lines and #410's expand-in-place hierarchy render unchanged (their own isolated tests, e.g. glossary-placement.test.ts and zone-inline-subzones.test.ts, needed no changes). \"Open\" navigates to the active tab. Renamed merge-graph's label \"Context Graph\"→\"PRD Graph\" in view-meta.ts (+ its own mg-title heading, its display-mode aria-label, and the link from prd.ts) per AC3; analysis stays \"Add Items\", no other view is labelled \"Plan\" — both already true, unchanged.\n\nUpdated tests for the new shape: navigation-model.test.ts (placementsOf tab: placement, grouped-section heading/blurb assertion, new per-tab naming test, rewrote the retired-SOURCEVISION_TABS describe block for sections+tabs), restored-views.test.ts (zones now asserted as a Terrain tab), iso-map-view.test.ts (iso-map asserted as a tab with hiddenWhenDeployed), shell.test.ts (replaced the 2D/3D toggle test with Terrain-tablist, arrow-key, deployed-mode-hides-iso-map, and Architecture-tablist tests; fixed two now-invalid `s.alt` references), navigation-a11y.test.ts (group-aware toggle-naming assertion, new per-tab naming assertion). Exported StageTab from the api.ts/views/index.ts barrels alongside StageSection. Replaced shell.css's .stage-section-projection(-btn) rules with .stage-section-tablist/.stage-section-tab.\n\nVerified: pnpm --filter @n-dx/web typecheck, full unit+integration suite (288 files/4183 tests), and full `pnpm preflight` (build+typecheck+docs+test+changeset across all 6 packages) all green. Added changeset .changeset/terrain-architecture-tabs.md (@n-dx/web patch)."
    lastModified: "2026-09-30T18:12:18.058Z"
    lastModifiedBy: "Ryan Keith <ryan.k@endash.us>"
