    resolutionDetail: "Added a redirect-alias table in shared/view-routing.ts (overview→analyze, rex-dashboard→work, with the rex-scope exception), applied server-side (301 in routes-static.ts, preserving sub-path/query), in viewer route parsing (route-state.ts), and in-app navigation (navigateTo/handleSidebarNav in use-route-state.ts, fixing the bottom-bar indicators). Rewrote navigation.spec.ts to source its view list from VIEW_META (fixing the missing \"ask\"), enabled feature-gated views' toggles before the deep-link loop, and added alias-redirect assertions. Added unit tests (view-routing.test.ts, new redirect-aliases.test.ts) and listed the contract test under TESTING.md Required Tests with matching architecture-policy.test.js enforcement."
