    resolutionDetail: "Dashboard aggregation carries a byModel split (hench turns, rex log, sv, Ask ledger) priced through rex's estimateCostFromTotals via the rex gateway — one pricing arithmetic, both surfaces agree to the cent (pinned against the rex fixture across two models). Token Usage view shows a Cost by Model table with priced-as labels for unknown ids and an unattributed line. Deviation from the original criterion 3: unknown models are priced at the labelled fallback (matching ndx usage) rather than excluded — excluding them would break the to-the-cent parity criterion; the merged duplicate's fresher acceptance (\"as the CLI does\") won. Also fixed the ndx usage headline missing smart-add spend."
