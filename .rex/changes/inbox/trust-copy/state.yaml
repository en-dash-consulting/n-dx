    resolutionDetail: "Added packages/web/src/shared/glossary.ts (single source of truth for all 8 terms) with getGlossaryDefinition(), wired through shared/index.ts and viewer/external.ts (+1 export, cap raised 33→34), and a new GlossaryLine viewer component rendering the definition or nothing. Wired at: files.ts (archetype, Archetype th), zones.ts (zone + weight, page stat line), zone-slideout.ts (zone pin, files section), enrichment-gate.ts (enrichment pass, shared by Architecture/Problems/Suggestions gates), prd.ts (epic/feature/task, Tasks header), workspaces.ts (worktree anchor, subtitle), hench-config.ts (guard rail, guard category only). Unit test tests/unit/shared/glossary.test.ts asserts every term is used and no orphan GlossaryLine calls; tests/unit/viewer/glossary-line.test.ts covers the component. No route/view id/config key changed."
