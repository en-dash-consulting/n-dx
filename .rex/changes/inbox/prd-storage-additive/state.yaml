    resolutionType: "code-change"
    resolutionDetail: "SourceVision's branch-work collector now reads the PRD via `rex tree --format=json` (new) and gets the completion diff from `rex tree-diff --json`, replacing its read of the legacy `.rex/prd.md`. Its private diff implementation is deleted. The PRD delta route already projected rex's `diffTrees`; a new root integration test pins that it and the CLI agree on one fixture."
