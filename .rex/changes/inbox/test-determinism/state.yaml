    resolutionDetail: "Shrank the two exact-path-set tests from 1110 items to 39 (21156ms/10721ms idle -> 175ms/123ms; 863ms/507ms under 4 concurrent tsc workers) and restated the third's `> 1000` bound as one-file-per-item, which is size-independent and strictly stronger. The size-step test keeps its 1110-item tree — scale is its subject — behind an explicit `5_100 * NDX_TEST_TIME_MULTIPLIER` per-test timeout derived from its measured idle worst case. All three still fail on the injected `writeIfChanged` regression (6v2, 39v2, 40v1). `@n-dx/rex` green under `soak-under-build-load.mjs --runs=1`."
    lastModified: "2026-09-28T19:48:41.322Z"
