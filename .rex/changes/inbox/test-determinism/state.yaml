  "9830182a-29a4-4d1a-a141-4fd921cdf6b7":
    status: "completed"
    startedAt: "2026-09-28T19:53:25.527Z"
    completedAt: "2026-09-28T20:16:08.458Z"
    endedAt: "2026-09-28T20:16:08.458Z"
    resolutionType: "code-change"
    resolutionDetail: "Commit 5900f9a6. Every wait in tests/e2e/cli-ci-child-cleanup.test.js now scales with NDX_TEST_TIME_MULTIPLIER — both PID-record deadlines (3_000 -> PID_RECORD_TIMEOUT_MS), the orphan-reap grace (2_000), the normal-exit grace (500, previously an inline literal at the success case) and the SIGINT case's per-test ceiling, which is now derived rather than hand-summed so it still sits above the guardrails inside it (100s at the default multiplier, inside the root config's 120s). The one wait deliberately NOT scaled is CHILD_FORCE_KILL_TIMEOUT_MS: it mirrors child-lifecycle.js's real 5s SIGTERM->SIGKILL timer, which is the product's clock, not the test's; the test-side allowance for observing it under load is the buffer beside it, which does scale. Justification is written at each constant. No predicate or assertion moved — the verdicts are still which PIDs are alive and what the parent printed.\n\nThe teardown survivor scan now runs its graces concurrently. At 40s each and left in series, a handful of survivors would have outrun the 120s hookTimeout and turned a named survivor list into an opaque hook failure. The waits are independent and nothing is paid in the green case, since a reaped PID never becomes a candidate.\n\nTimings (Intel Core Ultra 5 225F, 10 logical CPUs, 31.5 GB, Windows 11 26200, Node 24.16.0): file alone idle 2.17s, 2 tests; file alone under 2 concurrent tsc workers 2.80s, exit 0. The real evidence is the three-run soak at this commit — the file ran inside the root suite in all three full-suite runs under 2-worker tsc load and passed in each (root: 139 files, 2737 passed, 13 skipped, every run). The EBUSY teardown cascade did not recur."
    lastModified: "2026-09-28T20:16:09.262Z"
    lastModifiedBy: "Sterling H <sterling.h@endash.us>"
