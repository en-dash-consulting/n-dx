    resolutionDetail: "Verification task, no code change. First macOS root-suite run was 32190469600 (green); macOS green in 14 of 15 branch runs. The single failure (32283838405) was my own over-strict assertion about POSIX process reaping, triaged individually and fixed in f58c2cb5 rather than skipped — and notably none of the five macOS causes this task predicted was involved. No macOS-specific skips exist. Observed billed cost is 63 added minutes per run with macOS at 63%, against an estimate of ~38 at ~80%: total understated, macOS share overstated, because Windows is slower than assumed and macOS's root step is actually faster. Decision: KEEP macOS, on evidence rather than cost — on run 32283838405 ubuntu passed the identical suite that macOS failed, so macOS caught a POSIX defect ubuntu missed, refuting this task's own \"ubuntu already covers POSIX\" premise."
