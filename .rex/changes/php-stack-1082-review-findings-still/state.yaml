  "5ebf7eba-b5c3-4c21-b09b-80eed9399acb":
    status: "completed"
    startedAt: "2026-11-19T01:45:58.980Z"
    completedAt: "2026-11-19T02:15:14.055Z"
    endedAt: "2026-11-19T02:15:14.055Z"
    activeIntervals: [{"end":"2026-11-19T02:15:14.055Z","start":"2026-11-19T01:45:58.980Z"}]
    resolutionType: "code-change"
    resolutionDetail: "Reproduced at this head on generated PHP (~900 KB class files, every method with a query, a fetch and call_user_func on a fetched row). Before: dynamicCode alone on 20 MB sampled 2.4 GB peak heap; every kind 2.3 GB; one 900 KB file holds 72 MB of captures, 42 MB of them dynamic. Fix 1 (release): lang-runtime FrameworkPack gains optional digest(file, kinds), called as each file is parsed, after which that framework's query captures are dropped from the file; read gets digests by path; a throwing digest fails only that framework (notice names the file). php-dynamic digests each file: sites (builtin resolution deferred via new callCandidates/builtinReached in php-namespaces, filtered against repo declarations at read), scope names (batched), include scopes, and the database flow compiled (compileFlow) into a capture-free expression IR, keeping only scopes with a site or a return; MAX_EXPRESSION_DEPTH enforced at compile with identical semantics. Digest per 900 KB file: ~5 MB vs 42 MB of dynamic captures. After: 20 MB dynamicCode fits a 768 MB heap (fails at 512; imports alone fit 512); every kind fits 1 GB (before 2.3 GB). 10 MB dynamicCode fits 448 MB (was ~1.1 GB). Facts identical: dynamic-code facts and notices over all 29 lang-php fixture dirs byte-identical before/after; generated 5 MB input hash identical. Fix 3 (contain): file with more than MAX_DYNAMIC_CAPTURES (500,000, ~2x a dense 1 MiB file) is skipped with [php-dynamic-skipped] naming it; other files still read. Fix 2 (narrow dynamic.scm) not done: after the release, dynamic captures live for one file at a time (bounded by the runner's 1 MiB limit, ~45 MB), so narrowing could only shave that transient while risking fact identity; the remaining peak is the language queries' captures held for all files (imports/calls/config), which is separate work. Test: php-dynamic-memory.test.ts runs 10 MB generated PHP in a child Node capped at 640 MB (verified it OOMs at 640 with digest disabled), plus cap notice, digest wiring and digest-failure containment. lang-php 211 tests, lang-runtime, sourcevision PHP integration, root-policy, changeset-body-policy pass. Patch changeset for lang-php and lang-runtime."
    lastModified: "2026-11-19T02:15:14.055Z"
    lastModifiedBy: "Ryan Keith <ryan.k@endash.us>"
