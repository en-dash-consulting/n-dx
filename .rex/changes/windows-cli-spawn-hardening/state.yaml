  "72422229-4ca2-476d-9fa9-95ff8b6f8362":
    status: "completed"
    startedAt: "2026-09-03T17:44:31.911Z"
    completedAt: "2026-09-03T18:19:33.916Z"
    endedAt: "2026-09-03T18:19:33.916Z"
    resolutionType: "code-change"
    resolutionDetail: "execShellCmd now resolves the shell per platform via a new pure buildShellInvocation(command, platform, posixShellAvailable): `sh -c` wherever a POSIX shell is resolvable, `cmd.exe /d /s /c \"<cmd>\"` with windowsVerbatimArguments on a Windows box without one. DECISION on the Windows branch (the crux): PREFER sh, fall back to cmd.exe, rather than unconditional cmd.exe as the task's \"apply the same treatment as spawnCli\" reading implies. Unconditional cmd.exe would be more uniform but silently reinterprets every command string on the machines that work today — n-dx Windows users have Git for Windows because they need git, and hench's run_command passes whatever the model wrote, so it would trade a loud ENOENT for quiet misinterpretation. Preferring sh keeps those hosts byte-identical to POSIX and gives shell-less hosts a shell that exists; the difference is reported via ShellInvocation.kind rather than hidden. The `where sh` probe is memoized once per process, overridable in tests via _posixShellAvailable (following the existing _platform precedent). AC2: added REQUIRED `launched: boolean` to ExecResult — required, not optional, so every construction site in exec() must state it. false only on the spawn-error and synchronous-throw paths; exitCode stays 1 there so existing exit-code branching is untouched. A shell that launched and printed \"command not found\" is launched:true — the shell ran. AC5: routed the two remaining direct sh spawns (hench execShell, rex verify) through execShellCmd and made both consume `launched` — rex verify now reports ran:false + \"could not be launched\" instead of blaming the tests, hench execShell returns a launch-failure message instead of \"Exit code: 1\". AC4 VERIFICATION, not just an assertion: llm-client/tests/integration/exec-shell-windows.test.ts runs real commands (skipped off win32); since Git Bash puts sh on PATH here, I wrote .local_testing/no-posix-shell-run.mjs to strip Git/MSYS/Cygwin dirs from PATH and reproduce the PowerShell condition (`where.exe sh` from PowerShell confirmed NOT FOUND first). Under that condition: 5/5 green, and with the fix reverted 4/5 RED including the no-override production case reporting launched:false — the exact reported failure. Guard: new POSIX_SHELL_SPAWN guard in architecture-policy.test.js scans the production tree for a shell name paired with a -c argv; only exec.ts is exempt and the exemption is staleness-checked. That staleness check paid for itself immediately — my first detector regex only matched the positional `exec(\"sh\", [\"-c\"` form and missed exec.ts's own object-literal `{cmd:\"sh\", args:[\"-c\"...]}`, so it reported the exemption dead; widened to cover both. Proved red by reintroducing the old line in exec-shell.ts. ISSUES: three hench/llm-client unit tests hardcoded `cmd === \"sh\"` and broke — they were the same latent bug as the production code (green from Git Bash, red from PowerShell); fixed by passing _platform/_posixShellAvailable explicitly or accepting either shell, and both branches are now covered rather than the host's. Full-suite runs showed non-deterministic failures in the PRD folder-tree store (concurrent-write-lost-update, add-sibling-rename, routes-rex) — I did NOT assume these were pre-existing: stashed all my changes and ran the full suite on a clean baseline, which failed too, in the same routes-rex area with a different subset. Confirmed the known Windows stale-save-guard timing flake family, unrelated. Also corrected tests/shell-spawn-inventory.md, which still claimed a POSIX shell is a genuine Windows runtime requirement of the product — no longer true. FINAL: typecheck clean 6/6; run-all-tests 6/6 suites (root 1869, hench 3172, llm-client 1329, rex 4614, sourcevision 2278, web 3250); pr-check and obfuscation check pass. NOT DONE (sibling task, deliberately): runTestGate at test-runner.ts:586 still infers pass/fail from exitCode alone — task 'Test gate must not fail a run for a suite it never executed' owns consuming `launched` there; this task supplied the signal and fixed the root cause."
    lastModified: "2026-09-03T18:19:33.945Z"
    lastModifiedBy: "Sterling H <sterling.h@endash.us>"
