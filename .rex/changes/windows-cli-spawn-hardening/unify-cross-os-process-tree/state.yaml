  "134db348-9786-4723-9d68-501931faa499":
    status: "completed"
    startedAt: "2026-08-17T18:27:27.113Z"
    completedAt: "2026-08-17T18:43:09.399Z"
    endedAt: "2026-08-17T18:43:09.399Z"
    resolutionType: "code-change"
    resolutionDetail: "All 6 cases now execute and pass on Windows (commit 102f9ec4); root suite 2025 passed / 5 skipped / 0 failed, up from 2019 passed / 11 skipped. The real blocker was that the fixtures could not run on Windows at all: --import needed a file:// URL (ERR_UNSUPPORTED_ESM_URL_SCHEME) and all three preload regexes hardcoded forward slashes. AC4 (cases must be RED, demonstrating the leak) is NOT satisfiable and was not engineered: process.kill(pid,\"SIGINT\") is TerminateProcess on Windows so the handler never runs (parent exits 1, not 128+2), and the host Job Object reaps the tree regardless of ndx — verified with a probe containing no n-dx code. Documented in the test headers and pushed into the sibling terminateTree task, whose verification strategy was rewritten to assert the strategy RAN rather than rely on liveness."
  "deb8d3f6-17c9-4157-b4aa-1689e8249e6b":
    status: "completed"
    startedAt: "2026-08-17T19:36:54.669Z"
    completedAt: "2026-08-17T19:36:54.669Z"
    endedAt: "2026-08-17T19:36:54.669Z"
    resolutionType: "code-change"
    resolutionDetail: "Replaced the child-liveness escalation gate in terminateProcessGroup with group-based logic: groupHasMembers(pgid, killGroup) probes via signal 0, and waitForGroupExit polls it on a bounded deadline instead of awaiting the child's exit event, so every group member gets the grace period and SIGKILL is delivered whenever the group survives — regardless of whether the leader exited. PID-reuse safety argument documented at the probe. TDD: the leak test failed with `expected [] to deeply equal [[-4321,\"SIGKILL\"]]` before the fix; 26 tests green after. Also reworked two earlier POSIX tests whose mocks were written against the child-gated semantics (added a group-aware makeGroupKiller helper that models drain and excludes signal-0 probes from assertions). Windows taskkill path untouched. Recorded but not fixed: terminateTree's top-level !isChildRunning guard skips a tree kill for an already-exited child on both platforms — unreachable via the tracker, which unregisters on exit/close. Real process.kill(-pgid) still unexercised from a Windows host; covered by injection here and the e2e cleanup suites on Linux CI."
