    resolutionDetail: "Hench's rolling window is off under vitest unless a test opts in via _overrideTTY (packages/hench/src/types/output.ts), so agent output reaches the runner through console.log and silent:\"passed-only\" can drop it on green and show it on failure. The prd.md-alongside-tree warning is gone from the rex suite: cli-fix.test.ts seeded .rex/prd.md on top of the tree rex init had just created, and now writes fixtures through the shared writePRD helper. cli-smart-add.test.ts collapses 29 `rex init` spawns into one hoisted template (34 tests unchanged) and tests/e2e/cli-config.test.js collapses 25 identical spawns — 22 `--help` plus 3 `config <dir>` — into two (185 tests unchanged). Measured: rex 95.99s to 80.42s; hench loses the gate prompt and 17 git \"Switched to a new branch\" lines that bypassed console capture."
