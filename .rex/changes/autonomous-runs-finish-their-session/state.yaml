    resolutionType: "code-change"
    resolutionDetail: "runAdversarialReviewPass: when the reviewer writes no report (no-report) and either its own stream carried a background wait or it inherited one from the work session it resumed (the 01d15d75 shape), it is resumed once via --resume <reviewer session> with buildReviewResumeMessage(reportPath) telling it to write the report now from what it has; gated on VendorAdapter.resumesUnfinishedSessions. A second no-report is recorded as today (failed: no-report) with no third spawn; run.review.backgroundResumed marks either outcome. A review that writes its report is never resumed, and a no-report with no background wait anywhere keeps the existing path. Tests: tests/integration/review-background-resume.test.ts (5 stream-fixture cases)."
    lastModified: "2026-09-25T04:04:07.385Z"
    lastModifiedBy: "Ryan Keith <ryan.k@endash.us>"
  "20ecdcad-479f-414f-ba16-022af8560aa3":
    status: "completed"
    startedAt: "2026-09-25T04:04:03.796Z"
    completedAt: "2026-09-25T04:04:03.796Z"
    endedAt: "2026-09-25T04:04:03.796Z"
    resolutionType: "code-change"
    resolutionDetail: "spawnWithAdapter records SpawnResult.backgroundWait via the new VendorAdapter.detectBackgroundWait (Claude: Bash run_in_background:true, ScheduleWakeup, Monitor; Codex: none). cliLoop, when a session ends that way and hasUnfinishedWork (same view as the uncommitted-work gate) is true, resumes it once via --resume <sessionId> (no fork) with WORK_SESSION_RESUME_MESSAGE, gated on VendorAdapter.resumesUnfinishedSessions (Claude true, Codex false). A second occurrence fails the run with formatBackgroundWaitFailure naming the call, holds the claim, suppresses the rollback offer, and spawns no third time (dedicated backgroundWaitFailed flag). run.backgroundResume + spawnBreakdown[\"background-resume\"] record the resume (schema + zod updated). Tests: tests/integration/background-wait-resume.test.ts (stream fixtures vs a real git repo: resume + commit completes, ScheduleWakeup/Monitor, second wait fails with no third spawn, commit-despite-background not resumed, record survives reload, resumes work session not warm parent), background-wait-codex.test.ts, background-wait-spawn.test.ts, unit background-wait.test.ts. Changeset hench-resume-background-wait.md."
    lastModified: "2026-09-25T04:04:04.142Z"
    lastModifiedBy: "Ryan Keith <ryan.k@endash.us>"
