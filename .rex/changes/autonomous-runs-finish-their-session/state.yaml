    completedAt: "2026-09-25T04:04:10.624Z"
    endedAt: "2026-09-25T04:04:10.624Z"
    resolutionType: "code-change"
    resolutionDetail: "Chose the queue option. The attended review brief no longer tells the headless reviewer to \"offer to capture; capture only what the user selects\" or to wait for a selection: it reports should-fix/out-of-scope findings uncaptured and the run queues them. resolveReviewDispositions now parks on every run (dropped `autonomous` param), so attended offered findings become deferred and `hench review pending <runId>` lists them; the end-of-review line says \"queued for your decision\". Autonomous brief rows and capture behaviour unchanged. hench review help/docs and RunReviewRecord.deferredCount doc updated; prompt-token baseline re-recorded. Tests: tests/integration/review-attended-queue.test.ts (attended pending lists finding, brief no longer waits, autonomous unchanged), updated adversarial-review and review-deferred-capture tests."
    lastModified: "2026-09-25T04:04:10.968Z"
    lastModifiedBy: "Ryan Keith <ryan.k@endash.us>"
