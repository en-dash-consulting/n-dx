  "859a814b-4951-4569-aa9d-01e0eccbbedd":
    status: "completed"
    startedAt: "2026-09-25T05:48:11.320Z"
    completedAt: "2026-09-25T06:33:50.554Z"
    endedAt: "2026-09-25T06:33:50.554Z"
    resolutionType: "code-change"
    resolutionDetail: "All three criteria. (1) Claude spawns now pass --mcp-config <file> --strict-mcp-config from buildClaudeCliArgs, so every spawn (task, retry, warm-parent orientation, review-pass resume/fork) uses a run-scoped config naming the project dir absolutely. New packages/hench/src/process/agent-mcp-config.ts builds it, anchored on the core CLI from NDX_CLI_PATH and accepted only after confirming that install resolves back to this hench (mirrors core's resolveSubPackageCli; path-shape comparison cannot work under pnpm's store). Unusable launcher = today's inherit behaviour plus a printed reason. Codex adapter unchanged. (2) ndx init records \".\" instead of the absolute dir (shared MCP_PROJECT_ARG constant with buildTrackedMcpServers), removes reachable pinned entries, and reports the unreachable ones with the claude mcp remove command — read before the claude lookup so a missing CLI still reports. (3) cmdRun pre-flight warns via new claude-mcp-registration.ts, scoped to this repo's worktrees through the existing listWorktrees gateway export; silent only when the run will actually override (Claude with a usable launcher).\n\nDEVIATION from the chosen approach, point (d): the config is written to .hench/mcp/<runId>.json, NOT .hench/runs/<runId>.mcp.json. listRuns() collects every *.json in runs/ as a run id and slices to `limit` BEFORE validating, so a config file there would have consumed a slot and then been dropped — silently shortening hench list, the token rollups and the dashboard run feed. Age-bounded sweep on write bounds growth; .hench/mcp/ added to .gitignore and the ndx.gitignore template. Regression test covers it.\n\nKNOWN GAP, point (g): the agent's shell rex/ndx/n-dx commands still resolve from PATH; per-run shims are not implemented. Recorded in the changeset. This is version-coherence only — worktree targeting is handled by the absolute project directory regardless of which install's CLI runs.\n\nVerified end-to-end beyond the tests: the exact argv the fix generates, spawned from /tmp, starts a rex MCP server bound to this worktree and returns its PRD. Suites: root 2730, hench 3889, web 4034, rex 5340, sourcevision 2002, llm-client 1401 — all green; build, typecheck and pr-check pass."
    lastModified: "2026-09-25T06:33:50.911Z"
    lastModifiedBy: "Ryan Keith <ryan.k@endash.us>"
