  "24b06a30-3ff1-4ff4-af15-234ad907bd87":
    status: "completed"
    startedAt: "2026-09-22T21:45:47.739Z"
    completedAt: "2026-09-22T22:05:00.661Z"
    endedAt: "2026-09-22T22:05:00.661Z"
    resolutionType: "code-change"
    resolutionDetail: "tests/e2e/prd-slug-conformance.test.js now imports SLUG_RULE_VERSION, findNonConformingSlugs, serializeFolderTree, parseFolderTree and readSlugRuleMarker from packages/rex/src rather than packages/rex/dist/public.js, and asserts .rex/tree-meta.json's slugRule equals the build's SLUG_RULE_VERSION. A second describe block adds fresh fixtures for a foreign marker, a missing marker, and a re-slugged path. Written by hench run bd3dfdf5-4191-462d-bd75-fdde866bff1d (claude-sonnet-5), which stalled waiting on a backgrounded test run and never committed; the completion guard correctly refused to mark it done and reset the task. Work committed and closed out by hand after verification. Verified independently rather than read: set .rex/tree-meta.json's marker to slugRule 3 and then removed it entirely, running the file each time — the marker assertion failed in both cases (1 failed / 4 passed), and the file was restored and byte-compared against a backup. No dist import remains. Full root pnpm test green, 6/6 suites, so the new source imports do not breach the architecture policy test. Known weakness, left as-is: the second block's header comment claims it proves the marker check fails on a bad tree, but two of its three tests only round-trip readSlugRuleMarker — the check itself is inline in the first block and unreachable from a fixture. Hoisting that assertion into a shared helper would make the comment true."
    lastModified: "2026-09-22T22:05:01.005Z"
    lastModifiedBy: "Ryan Keith <ryan.k@endash.us>"
  "563aace2-25a9-4f53-b754-560c2da6bb06":
    status: "completed"
    startedAt: "2026-09-25T06:48:50.543Z"
    completedAt: "2026-09-25T07:07:10.470Z"
    endedAt: "2026-09-25T07:07:10.470Z"
    resolutionType: "code-change"
    resolutionDetail: "The shape is COSMETIC. A fixture test (packages/rex/tests/integration/children-table-omission.test.ts) builds a conformant tree, strikes one leaf .md child and one child directory from a feature's Children table, then loads and saves through the real FolderTreeStore: both children load, both survive the full-tree save, and the save regenerates the table complete. The parser walks the filesystem and never reads the table (folder-tree-parser.ts:13), so nothing is hidden from the loader. The execution plan's claim that such items are \"deleted by the next full-tree save\" conflated this with orphaned-directory — a directory that has lost its index.md, which cannot be parsed as an item at all and whose contents a full save does collect as unreachable. That is the shape commit 47062ab3 restored five files from, and it already has an issue class. Per the third acceptance criterion's survives-branch, rex validate --post-merge now reports children-table-out-of-sync as repairable (advisory to the #396 CI gate, not blocking), in both directions — a child on disk that no row lists, and a row pointing at a file that is gone. --repair rewrites the table from the directory."
    lastModified: "2026-09-25T07:07:11.051Z"
    lastModifiedBy: "Ryan Keith <ryan.k@endash.us>"
  "5c09a992-afdb-4ca0-8c0a-2d52569289d6":
    status: "completed"
    startedAt: "2026-09-21T20:59:18.432Z"
    completedAt: "2026-09-21T21:22:06.637Z"
    endedAt: "2026-09-21T21:22:06.637Z"
    resolutionType: "code-change"
    resolutionDetail: "tree-meta.json now carries a slugRule marker from SLUG_RULE_VERSION; both local stores refuse a save whose marker differs, adopt a conformant unmarked tree, and refuse a non-conformant one. rex migrate-slugs is the sole escape and sets the marker in the same locked write. rex validate reports a mismatch as an error. A fixture pin test fails on any rule change until the version is bumped."
    lastModified: "2026-09-21T21:22:06.974Z"
    lastModifiedBy: "Ryan Keith <ryan.k@endash.us>"
