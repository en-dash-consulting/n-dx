  "4afde06c-532e-4d2e-966e-6006f4860278":
    status: "completed"
    startedAt: "2026-08-17T21:15:56.307Z"
    completedAt: "2026-08-17T21:31:39.949Z"
    endedAt: "2026-08-17T21:31:39.949Z"
    resolutionType: "code-change"
    resolutionDetail: "tests/setup-color-env.js (vitest setupFile) deletes FORCE_COLOR and COLORTERM and sets NO_COLOR=1, wired into the root config and all five package configs — setupFiles rather than globalSetup because it must run inside each worker before any module reads the memoised color caches, and because mutating the worker's env is what makes spawned CLI children inherit the neutralized values. web's existing setupFiles entry was appended to, not replaced. Root suite: 24 color failures -> 0; verified 91 files / 2070 passed / 0 failed BOTH with FORCE_COLOR=3 COLORTERM=truecolor and with them unset. Scope correctly grew to sourcevision, which had 9 more of the same class (9 -> 0, 1691 passed). AC5 holds by construction: zero existing test files modified, so no assertion could have been relaxed. AC6 was already met by tests/e2e/cli-tty-color.test.js (12 tests asserting ANSI IS emitted under FORCE_COLOR=1 and suppressed otherwise) — confirmed green rather than duplicated; added tests/unit/color-env-neutralized.test.js as a guard against the setupFile being removed. AC1 NOT literally achievable: `pnpm test` still exits non-zero due to PRE-EXISTING non-color failures — rex 4 files (known ambient-load set, task 676af18f), hench 32, web 7 — each measured identically with and without the color vars, and hench re-verified with the changeset stashed. Zero color-attributable failures remain anywhere. Side discovery filed as task 741bacf1: hench and web never execute in a full run because pnpm stops at rex's flakes, hiding those 39 failures (and likely on CI too, which runs the same command)."
  "5980e3ed-8b85-4500-b6f6-abae8f81cf72":
    status: "completed"
    startedAt: "2026-08-19T17:53:09.153Z"
    completedAt: "2026-08-19T18:17:35.666Z"
    endedAt: "2026-08-19T18:17:35.666Z"
    resolutionType: "code-change"
    resolutionDetail: "Each sibling count now builds in its own store (removing the shared-tree confound) and each reading is the min of 7 timed passes over a tree built once. Min-of-3 as filed was measured and rejected — it left ratios spanning 4.91x/7.15x/3.23x and only 1.68x of margin, essentially the defect it was meant to fix; min-of-7 collapsed the spread to 1.11x for ~1-2s, since setup dominates and extra passes are nearly free. Bound tightened 12x → 8x (not raised) and verified in both directions: an injected (cohort size)² term fails it at 9.4x, which the old 12x bound would have permitted. Added an idempotence assertion so repeated timing is sound, plus permanent ratio logging and a recorded sensitivity limit. Green across three consecutive full rex-suite runs with the 60s timeout unchanged."
  "676af18f-c764-45e3-812c-6755fa0004c7":
    status: "completed"
    startedAt: "2026-08-18T15:21:50.276Z"
    completedAt: "2026-08-18T15:53:59.776Z"
    endedAt: "2026-08-18T15:53:59.776Z"
    resolutionType: "code-change"
    resolutionDetail: "Classified all four and treated each per cause. profile-prd-tree-write -> BENCHMARK (every assertion was toBeGreaterThan(0), so it was never a gate): renamed to .bench-manual.ts, out of the default include, runnable via new `pnpm --filter @n-dx/rex bench` with a dedicated vitest.bench.config.ts and fileParallelism off. folder-tree-parser and add-auto-reshape -> GATES, absolute wall-clock replaced with same-run two-size ratio assertions; bounds derived from measured baselines (parse 6.3x for 11.3x size; scoped pass 4.3x for 4x siblings) and recorded in comments, each still catching a quadratic regression. prd-tree-atomic-writes -> NOT a budget but a BROKEN test: it pushed \"second-start\" before the second writer ever requested the lock and after a fixed 10ms sleep, so it asserted \"addItem finishes within 10ms\" rather than serialization; replaced with an event-based assertion at the lock itself plus a no-lost-writes test. Also corrected the task's premise: packages already run sequentially since the masking fix, so the flakes came from rex's own parallel workers, and the suggested --workspace-concurrency=1 would not have helped. VERIFIED: 3 consecutive rex-only runs green (4406 passed each), then 3 consecutive full `pnpm test` runs with rex PASS and zero failures across all five timing-sensitive files. Disclosed cost: the reshape test builds 125 items to measure two sizes (~14s, setup-dominated) and needed an explicit 60s timeout as a hang guard. Fifth same-class file (write-path-profile, absolute 5s/20s/60s budgets, seen failing once at 5005ms) filed separately as 94e03432 rather than folded in."
