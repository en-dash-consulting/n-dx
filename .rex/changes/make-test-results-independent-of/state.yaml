    startedAt: "2026-09-25T13:49:21.940Z"
    completedAt: "2026-09-25T13:57:21.444Z"
    endedAt: "2026-09-25T13:57:21.444Z"
    resolutionType: "code-change"
    resolutionDetail: "Wrapped all 6 unwrapped commits in \"Guide modal accessibility\" (5 btn?.click() + 1 window.dispatchEvent Escape) in act(). Escape test's two setTimeout(50) sleeps, its waitFor() poll, and the \"Preact schedules via rAF\" comment removed — assertions now run directly after act(). Deleted now-unused waitFor() helper. Swept rest of file: DensitySelector/StatusFilter/PRDTree click and keydown handlers only call setState (microtask-scheduled render, not the rAF/setTimeout(35) effect-fallback) or plain focus() with no state change, so they don't arm the guard and were left as-is. Verified with a temporary ever-armed setTimeout(_,35) counter wired into vitest.config.ts setupFiles: armed=0 (down from 6); sanity-checked the probe by reverting the Escape act() wrap, which reproduced a real test failure (assertion ran before the unwrapped dispatch's effect committed) — confirming the fix is behavioral, not cosmetic. Probe file and config wiring removed afterward (verification-only, not committed). accessibility.test.ts: 34/34 pass. Full @n-dx/web suite: 278 files/4048 tests pass, 0 failed. Web typecheck clean. Root tests/unit/vitest-timeout-policy.test.js + tests/e2e/wall-clock-inventory-policy.test.js pass. Test-only change, no changeset."
    lastModified: "2026-09-25T13:57:23.022Z"
    lastModifiedBy: "Ryan Keith <ryan.k@endash.us>"
