  "36cd4378-93d4-4cf7-8381-7029a98ef2f2":
    status: "completed"
    startedAt: "2026-09-07T21:07:14.682Z"
    completedAt: "2026-09-07T21:17:10.515Z"
    resolutionType: "code-change"
    resolutionDetail: "findSubSvDirs() now skips .claude and any directory git reports as a worktree registered strictly inside the analysis root. The worktree set is resolved once per scan via `git worktree list --porcelain` (cwd = analysis root), compared on realpath-resolved absolute paths, and never contains the root itself. Best-effort: git missing, non-repo, failure, or timeout yields an empty set and the scan proceeds unchanged. 6 unit tests added (24/24 pass); the 3 behavioral ones were confirmed red with the fix disabled. Verified against real git output on this repo: analyzing the main checkout detects all 8 nested worktrees while the sibling ndx-stable checkout is correctly ignored."
    metAt: "4dc27b3e250f4e2bddcdaa354985e5659fe70259d967ee98d719baa61ac2fe7c"
    lastModified: "2026-09-07T21:07:14.690Z"
    lastModifiedBy: "Ryan Keith <ryan.k@endash.us>"
